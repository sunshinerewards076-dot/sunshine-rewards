<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FF9F1C">
<title>Sunshine Admin</title>
<style>
:root{--a:#FF9F1C;--d:#E8590C;--ink:#2B1600;--mute:#7A6A55;--line:#F1DEB0;--bg:#FFF8E6}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.box{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.box h1{font-size:30px}
button{font:inherit;cursor:pointer}
.b{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(180deg,#FFC93C,var(--a));color:var(--ink)}
.b.g{background:#2E9E3A;color:#fff}.b.r{background:#D6372E;color:#fff}.b.l{background:#fff;border:1.5px solid var(--line)}
.b:disabled{opacity:.5}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#FFB300,var(--d));color:#fff;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:18px}header small{opacity:.9}
#tabs{display:flex;gap:6px;padding:10px 12px;overflow:auto}
#tabs button{border:0;border-radius:99px;padding:9px 16px;font-weight:700;background:#fff;border:1.5px solid var(--line);white-space:nowrap}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#view{max-width:720px;margin:0 auto;padding:0 12px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mute{color:var(--mute)}.sm{font-size:13px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st .card{margin:0;text-align:center}.st b{display:block;font-size:26px}
.chip{display:inline-block;border-radius:8px;padding:1px 10px;font-size:12px;font-weight:700;background:#FFF0B3;color:#8A5A00}
.chip.approved,.chip.paid{background:#D9F5DF;color:#1E8A3A}.chip.rejected{background:#FFDADA;color:#C00}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font:inherit;margin-bottom:12px;background:#fff}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.4 ui-monospace,Consolas,monospace;background:#FFF4DC;border-radius:10px;padding:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="login" class="box"><h1>Sunshine Admin</h1><p class="mute">Only the admin Google account can enter.</p><button class="b" onclick="login()">Sign in with Google</button><p id="err" style="color:#C00;font-weight:700"></p></div>
<main id="app" hidden>
  <header><b>Sunshine Admin</b><small id="who"></small><button class="b l" onclick="out()">Logout</button></header>
  <div id="tabs"></div>
  <section id="view"></section>
</main>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyBoomsal7jbIuLTvBBIUM0TgDwfRY0sbdY",authDomain:"sunshine-rewards-eadbf.firebaseapp.com",projectId:"sunshine-rewards-eadbf",storageBucket:"sunshine-rewards-eadbf.firebasestorage.app",messagingSenderId:"198715788076",appId:"1:198715788076:web:c442ef15ab8da4ecdafa89"};
/* task id -> [name, reward]. Keep this in sync with OFFERS in the app. */
const OFFERS={"5paisa":["5paisa",260],angelone:["Angel One",120],stablemoney:["Stable Money",200],phonepe:["PhonePe",32],airtelbank:["Airtel Payments Bank",100],navi:["Navi",5],hdfc:["HDFC Securities",40],cashkaro:["CashKaro",2]};
const REF=0.05;
const $=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString():"";
let DB,AUTH,tab="dash",PF="pending",WF="pending",users=[],q="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2800)}
const TABS=[["dash","Dashboard"],["proofs","Proofs"],["wd","Withdrawals"],["users","Users"]];
function go(t){tab=t;draw()}
async function draw(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  $("#view").innerHTML='<p class="mute" style="padding:20px 0">Loading...</p>';
  try{$("#view").innerHTML=await({dash,proofs,wd,usersView})[tab]()}catch(e){$("#view").innerHTML=`<p style="color:#C00;padding:20px 0">${E(e.message)}</p>`}
}
async function dash(){
  const [u,p,w]=await Promise.all([DB.collection("users").limit(1000).get(),DB.collection("submissions").where("status","==","pending").get(),DB.collection("withdrawals").where("status","==","pending").get()]);
  let bal=0;u.forEach(d=>bal+=d.data().uc||0);let owe=0;w.forEach(d=>owe+=d.data().amt||0);
  return `<div class="st"><div class="card"><b>${u.size}</b><span class="mute sm">Users</span></div><div class="card"><b>${fmt(bal)}</b><span class="mute sm">Total user balance (SC)</span></div>
  <div class="card"><b>${p.size}</b><span class="mute sm">Pending proofs</span></div><div class="card"><b>${w.size}</b><span class="mute sm">Pending withdrawals (${fmt(owe)} SC)</span></div></div>`;
}
const fbar=(cur,fn)=>`<div class="acts" style="margin:0 0 12px">${["pending","approved","rejected","paid"].filter(x=>fn!=="wd"||x!=="approved").filter(x=>fn==="wd"||x!=="paid").map(x=>`<button class="b ${x===cur?"":"l"}" onclick="${fn==="wd"?"WF":"PF"}='${x}';draw()">${x}</button>`).join("")}</div>`;
async function proofs(){
  const s=await DB.collection("submissions").where("status","==",PF).get();
  const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);
  return fbar(PF,"p")+(l.length?l.map(x=>{const o=OFFERS[x.task]||[x.task,0];return `<div class="card"><div class="row"><div><b>${E(o[0])}</b> <span class="chip ${x.status}">${x.status}</span><div class="mute sm">${E(x.email)}</div></div><b>₹${fmt(o[1])}</b></div>
  <pre>${E(x.proof)}</pre>${x.shot?`<img src="${x.shot}" alt="Screenshot" style="max-width:100%;max-height:260px;border-radius:10px;margin-top:8px;cursor:zoom-in" onclick="zoom(this.src)">`:`<p class="mute sm" style="margin-top:6px">No screenshot</p>`}<div class="mute sm" style="margin-top:6px">${when(x.t)}</div>
  ${x.status==="pending"?`<div class="acts"><button class="b g" onclick="approve('${x.id}',this)">Approve</button><button class="b r" onclick="rejectProof('${x.id}',this)">Reject</button></div>`:""}</div>`}).join(""):'<p class="mute">Nothing here.</p>');
}
async function approve(id,btn){
  btn.disabled=true;
  try{
    const sref=DB.collection("submissions").doc(id),s=(await sref.get()).data(),reward=(OFFERS[s.task]||[0,0])[1];
    if(!reward)throw new Error("Unknown task. Add it to OFFERS in admin.html.");
    const uref=DB.collection("users").doc(s.uid),by=(await uref.get()).data().by;let rref=null;
    if(by){const r=await DB.collection("users").where("code","==",by).limit(1).get();if(!r.empty&&r.docs[0].id!==s.uid)rref=r.docs[0].ref}
    await DB.runTransaction(async t=>{
      const a=await t.get(sref);if(a.data().status!=="pending")throw new Error("Already handled.");
      const u=(await t.get(uref)).data(),rr=rref?(await t.get(rref)).data():null,up={uc:(u.uc||0)+reward,earned:(u.earned||0)+reward};
      t.update(sref,{status:"approved",reward,at:Date.now()});
      if(rr){const b=Math.round(reward*REF*100)/100;t.update(rref,{uc:(rr.uc||0)+b,earned:(rr.earned||0)+b,...(u.refCounted?{}:{refs:(rr.refs||0)+1})});up.refCounted=true}
      t.update(uref,up);
    });
    toast("Approved. ₹"+reward+" credited.");draw();
  }catch(e){toast(e.message);btn.disabled=false}
}
async function rejectProof(id,btn){
  if(!confirm("Reject this proof?"))return;btn.disabled=true;
  try{await DB.collection("submissions").doc(id).update({status:"rejected",at:Date.now()});toast("Rejected.");draw()}catch(e){toast(e.message);btn.disabled=false}
}
async function wd(){
  const s=await DB.collection("withdrawals").where("status","==",WF).get();
  const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);
  return fbar(WF,"wd")+(l.length?l.map(x=>`<div class="card"><div class="row"><div><b>${x.kind==="bank"?"Bank":"UPI"} transfer</b> <span class="chip ${x.status}">${x.status}</span><div class="mute sm">${E(x.email)}</div></div><b>₹${fmt(x.amt)}</b></div>
  <pre>Name: ${E(x.name)}\n${x.kind==="bank"?"Account: "+E(x.acc)+"\nIFSC: "+E(x.ifsc):"UPI: "+E(x.upi)}</pre><div class="mute sm" style="margin-top:6px">${when(x.t)}</div>
  <div class="acts"><button class="b l" onclick="copy('${E(x.kind==="bank"?x.acc:x.upi)}')">Copy ${x.kind==="bank"?"account":"UPI"}</button>
  ${x.status==="pending"?`<button class="b g" onclick="paid('${x.id}',this)">Mark paid</button><button class="b r" onclick="refund('${x.id}',this)">Reject and refund</button>`:""}</div></div>`).join(""):'<p class="mute">Nothing here.</p>');
}
function zoom(src){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out";o.innerHTML=`<img src="${src}" style="max-width:100%;max-height:100%;border-radius:8px">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
const copy=v=>navigator.clipboard?.writeText(v).then(()=>toast("Copied"),()=>toast(v));
async function paid(id,btn){
  if(!confirm("Mark as paid? Only do this after you sent the money."))return;btn.disabled=true;
  try{await DB.collection("withdrawals").doc(id).update({status:"paid",at:Date.now()});toast("Marked paid.");draw()}catch(e){toast(e.message);btn.disabled=false}
}
async function refund(id,btn){
  if(!confirm("Reject and refund the coins to the user?"))return;btn.disabled=true;
  try{
    const wref=DB.collection("withdrawals").doc(id),w=(await wref.get()).data(),uref=DB.collection("users").doc(w.uid);
    await DB.runTransaction(async t=>{
      const a=await t.get(wref);if(a.data().status!=="pending")throw new Error("Already handled.");
      const u=(await t.get(uref)).data();
      t.update(wref,{status:"rejected",at:Date.now()});t.update(uref,{uc:(u.uc||0)+(w.amt||0)});
    });
    toast("Rejected and refunded.");draw();
  }catch(e){toast(e.message);btn.disabled=false}
}
async function usersView(){
  const s=await DB.collection("users").limit(500).get();
  users=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.joined||0)-(a.joined||0));
  return `<input id="q" placeholder="Search name, email or referral code" oninput="q=this.value;list()" value="${E(q)}"><div id="ul"></div>`;
}
function list(){
  const k=q.trim().toLowerCase(),l=users.filter(u=>!k||[u.name,u.email,u.code].some(v=>String(v||"").toLowerCase().includes(k)));
  $("#ul").innerHTML=l.slice(0,100).map(u=>`<div class="card"><div class="row"><div><b>${E(u.name)}</b><div class="mute sm">${E(u.email)}</div><div class="mute sm">Code ${E(u.code)}${u.by?" · referred by "+E(u.by):""} · ${u.refs||0} referrals</div></div>
  <div style="text-align:right"><b>${fmt(u.uc)} SC</b><div class="mute sm">earned ${fmt(u.earned)}</div></div></div><div class="acts"><button class="b l" onclick="adjust('${u.id}')">Adjust balance</button></div></div>`).join("")||'<p class="mute">No users found.</p>';
}
async function adjust(id){
  const v=prompt("Add or remove coins. Example: 10 or -10");if(v===null)return;const n=Number(v);
  if(!n||!isFinite(n))return toast("Enter a valid number.");
  try{
    const uref=DB.collection("users").doc(id);
    await DB.runTransaction(async t=>{const u=(await t.get(uref)).data();if((u.uc||0)+n<0)throw new Error("Balance cannot go below zero.");t.update(uref,{uc:(u.uc||0)+n,...(n>0?{earned:(u.earned||0)+n}:{})})});
    toast("Balance updated.");draw();
  }catch(e){toast(e.message)}
}
async function login(){$("#err").textContent="";try{await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$("#err").textContent="Sign-in failed."}}
function out(){AUTH.signOut()}
firebase.initializeApp(FB);AUTH=firebase.auth();DB=firebase.firestore();
AUTH.onAuthStateChanged(async u=>{
  if(!u){$("#app").hidden=true;$("#login").hidden=false;return}
  try{await DB.collection("submissions").limit(1).get()}
  catch(e){$("#err").textContent="Access denied. This Google account is not the admin.";AUTH.signOut();return}
  $("#login").hidden=true;$("#app").hidden=false;$("#who").textContent=u.email;draw();
});
</script>
</body>
</html>
