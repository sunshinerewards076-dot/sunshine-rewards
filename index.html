function msg(ok,title,text){openSheet(`<div class="md ${ok?"ok":"bad"}"><div class="ic">${ok?"✓":"✕"}</div><h2>${title}</h2><p>${text}</p><button class="btn ${ok?"":"red"}" onclick="closeSheet()">${ok?"Continue":"Go Back"}</button></div>`,1)}
function boom(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=["#FFD23F","#FF8A00","#FF4D6D","#B23AFF","#3DDC97","#38B6FF"];
  for(let i=0;i<44;i++){const e=document.createElement("i");
    e.style.cssText=`position:fixed;left:50%;top:55%;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;background:${c[i%6]}`;
    document.body.appendChild(e);const a=Math.random()*6.28,d=120+Math.random()*190;
    e.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+160}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1300,easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish=()=>e.remove();}
}

}
async function addRec(col,rec){(col==="submissions"?subs:wds).push(rec);await DB.collection(col).add(rec)}

/* ---- routing ---- */
const TAB=TABS.map(t=>t[0]);
function goTab(p){hist=[];P=p;A=null;if(p==="earn")loading=true;draw()}
function go(p,a){hist.push([P,A]);P=p;A=a;draw()}
function back(){const h=hist.pop()||["home",null];P=h[0];A=h[1];draw()}
function toEarn(t){ET=t;goTab("earn")}
function draw(){
  clearInterval(bt);
  const f={home,earn,refer,wallet,profile,rewards,offer,redeem,faq}[P];
  $("#app").innerHTML=`<div class="pg">${f(A)}</div>`;
  $("#nav").hidden=!TAB.includes(P);
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===P?"on":""}" aria-label="${l}" onclick="goTab('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${l}</span></button>`).join("");
  scrollTo(0,0);
  if(P==="home")startBanner();
  if(P==="earn"&&loading)setTimeout(()=>{loading=false;if(P==="earn")draw()},500);
}
function startBanner(){let i=0;bt=setInterval(()=>{const t=$("#bt");if(!t)return;i=(i+1)%2;t.style.transform=`translateX(-${i*100}%)`},4200)}

function offer(id){

function openSpin(){
  const lb=PRIZES.map((p,i)=>`<span style="transform:rotate(${i*45+22.5}deg) translateY(-92px)">${p}</span>`).join(""),d=U.spin===day();
  openSheet(`<h2 class="c">Spin &amp; Earn</h2><p class="mute sm c">One spin a day. Win 1 to 5 Sun Coins.</p><div class="wheelbox"><div class="pin"></div><div class="wheel" id="wheel">${lb}</div><div class="hub"></div></div>
  <button class="btn" id="sbtn" onclick="spin()" ${d?"disabled":""}>${d?"Come back tomorrow":"Spin now"}</button><button class="btn" style="background:#fff;border:2px solid var(--line)" onclick="closeSheet()">Close</button>`);
}
async function spin(){
  if(U.spin===day()||spinning)return;spinning=true;$("#sbtn").disabled=true;
  const w=PRIZES.map(p=>WT[p]),tot=w.reduce((a,b)=>a+b);let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++}
  $("#wheel").style.transform=`rotate(${360*6-(i*45+22.5)}deg)`;
  const p=PRIZES[i];U.spin=day();U.uc+=p;U.earned=(U.earned||0)+p;
  await new Promise(r=>setTimeout(r,4300));spinning=false;await save();boom();toast("You won "+p+" Sun Coins!");$("#sbtn").textContent="Come back tomorrow";if(P!=="offer")draw();
}

const wallet=()=>{
  const ear=subs.filter(s=>s.status==="approved").map(s=>({t:s.t,n:nm(s.task),a:fmt((OFFERS.find(o=>o.id===s.task)||{reward:0}).reward)}));
  const list=WTB==="earn"?(ear.length?ear.sort((a,b)=>b.t-a.t).map(e=>`<div class="of" style="cursor:default"><span class="nm"><span class="lg">${E(e.n.slice(0,2))}</span><span>${E(e.n)}<small class="mute" style="display:block;font-weight:600;font-size:12px">${new Date(e.t).toLocaleDateString()}</small></span></span><span class="rw"><span class="coin">₹</span>${e.a}</span></div>`).join(""):'<p class="c" style="padding:40px 0;font-weight:800">No Data Found</p>')
   :(wds.length?[...wds].sort((a,b)=>b.t-a.t).map(w=>rib(w.status==="paid"?"ok":w.status,w.status==="paid"?"Success":"Pending",(w.kind==="bank"?"Bank":"UPI")+" Withdrawal",w.amt+" withdrawn "+new Date(w.t).toLocaleDateString(),fmt(w.amt),w.kind==="bank"?"B":"U")).join(""):'<p class="c" style="padding:40px 0;font-weight:800">No Data Found</p>');
  return hd("Wallet")+`<div class="card t ws"><span class="mute" style="font-weight:800">Total Balance</span><div class="bal">${fmt(U.uc)}</div><button class="btn sm2" onclick="openWithdraw()">Withdraw</button></div>
  <section class="sh"><div class="tabs"><button class="${WTB==="earn"?"on":""}" onclick="WTB='earn';draw()">Earnings</button><button class="${WTB==="red"?"on":""}" onclick="WTB='red';draw()">My Redeems</button></div>${list}</section>`;
};

 <div class="wd"><h3>UPI Transfer</h3><p>Withdraw your money by your UPI</p><button class="btn" onclick="closeSheet();go('redeem','upi')">Withdraw</button></div>

const redeem=k=>hd("Redeem")+`<div class="tk" style="--n:50px"><label for="nm0">Enter your Name</label><input id="nm0" autocomplete="name">
 ${k==="upi"?`<label for="up">UPI ID</label><input id="up" placeholder="name@bank" autocomplete="off">`:`<label for="ac">Account Number</label><input id="ac" inputmode="numeric"><label for="if">IFSC Code</label><input id="if" autocapitalize="characters">`}
 <label for="am">Enter amount (Min 5 Max 500)</label><input id="am" type="number" inputmode="decimal" placeholder="Enter amount"><button class="btn" onclick="doRedeem('${k}')">Transfer</button></div><p class="c" style="font:800 20px 'Baloo 2'">1 Sun Coin = 1 INR</p>`;
async function doRedeem(k){
  const n=$("#nm0").value.trim(),am=Number($("#am").value),rec={uid:U.id,email:U.email,kind:k,name:n,amt:am,status:"pending",t:Date.now()};
  if(n.length<2)return toast("Enter your name.");
  if(k==="upi"){rec.upi=$("#up").value.trim();if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(rec.upi))return toast("Enter a valid UPI ID, like name@bank.")}
  else{rec.upi=rec.acc=$("#ac").value.trim();rec.ifsc=$("#if").value.trim().toUpperCase();if(!/^\d{9,18}$/.test(rec.acc))return toast("Enter a valid account number.");if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(rec.ifsc))return toast("Enter a valid IFSC code.")}
  if(!(am>=5&&am<=500))return toast("Amount must be between 5 and 500.");
  if(am>U.uc)return toast("You do not have enough balance.");
  U.uc-=am;await save();await addRec("withdrawals",rec);WTB="red";hist=[];P="wallet";draw();msg(true,"Success","Withdrawal requested. It will be paid after review.");
}

 <p class="c" style="font-weight:800;margin-top:10px">Contact Us On</p><div class="fx" style="position:static;transform:none;width:auto;margin-top:8px"><button class="btn" onclick="${SUPPORT_EMAIL?`location.href='mailto:${SUPPORT_EMAIL}'`:"toast('Support email coming soon')"}">On Mail</button><button class="btn" onclick="tg()">On Telegram</button></div></section>`;

 :`<h2>Terms of Service</h2><p style="margin-top:10px">Rewards are paid only after a partner company verifies the task. Sunshine Rewards is not responsible for rewards a partner declines, delays or cancels. Fake, duplicate or misleading proofs lead to a ban and loss of balance. We may change offers and rewards at any time.</p><button class="btn" onclick="closeSheet()">Got it</button>`)}

/* ---- boot ---- */
(function boot(){
  $("#splash").innerHTML=LOGO+'<div class="spn"></div><h2 style="font-size:30px">Loading...</h2><small>Security Verification in Progress. Please wait...</small>';
  $("#login").innerHTML=LOGO+'<h1>Sunshine Rewards</h1><p>Finish simple offers. Earn real money.</p><button class="btn" onclick="login()">Continue with Google</button>';
  const r=new URLSearchParams(location.search).get("ref");if(r)ls("sr_ref",r.toUpperCase().slice(0,12));
  firebase.initializeApp(FB);AUTH=firebase.auth();DB=firebase.firestore();
  AUTH.onAuthStateChanged(async u=>{
    if(!u){U=null;toLogin();return}
    const d=await DB.collection("users").doc(u.uid).get();
    if(d.exists)U=d.data();else{U=newUser(u.uid,u.displayName,u.email,u.photoURL);if(U.by===U.code)U.by="";await save()}
    await loadLists();enter();
  });
})();
