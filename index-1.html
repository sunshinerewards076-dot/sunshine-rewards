<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120B2E">
<title>Sunshine Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120B2E;--ink:#F4F0FF;--mute:#A79FC9;--sun:#FFD23F;--ember:#FF8A00;--coral:#FF4D6D;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:15px/1.5 'Nunito Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;padding-bottom:88px;background:radial-gradient(120% 60% at 90% -5%,#4B2A9B 0,transparent 60%),radial-gradient(90% 50% at -10% 30%,#7A2A6B 0,transparent 55%),var(--bg);background-attachment:fixed}
h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.1}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:16px 16px 8px}
.mute{color:var(--mute)}.sm{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:28px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--sun);background:#2A1D63}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#2B1200;background:linear-gradient(140deg,#FFE35C,#FF9A00 55%,#FF5E3A);box-shadow:0 14px 40px rgba(255,138,0,.35);margin-bottom:16px}
.hero::before{content:"";position:absolute;right:-110px;top:-110px;width:320px;height:320px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 8deg,transparent 8deg 20deg);animation:turn 60s linear infinite}
.hero>*{position:relative}
.coin{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 60%,#E58A00);border:3px solid #FFF1A8;font:800 14px 'Baloo 2';color:#7A3F00;vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bal{font-size:54px;font-weight:800;margin:4px 0 0;display:flex;align-items:center;gap:10px}
@keyframes turn{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{background:rgba(255,210,63,.16);color:var(--sun);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:700}
.sec{font-size:20px;margin:6px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:13px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,var(--sun),var(--ember));color:#2B1200;margin-top:12px;box-shadow:0 6px 18px rgba(255,138,0,.28)}
.btn.dark{background:#2A1D63;color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6FA8FF;outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;cursor:pointer;background:var(--card)}
.tile b{display:block;font:800 17px 'Baloo 2'}.tile span{font-size:13px;color:var(--mute)}
.tile i{font-style:normal;font-size:26px;display:block;margin-bottom:4px}
.tile.hot{background:linear-gradient(135deg,#FF4D6D,#B23AFF);border:0}.tile.hot span{color:#fff}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0 2px}
.d{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--mute)}
.d.on{background:linear-gradient(135deg,var(--sun),var(--ember));color:#2B1200}
.d.gift{border-radius:9px;background:var(--coral);color:#fff;box-shadow:0 0 14px rgba(255,77,109,.7)}
.task{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--sun),var(--ember));color:#2B1200;display:grid;place-items:center;font:800 22px 'Baloo 2';flex:none}
.task b{display:block;font-size:15.5px}
.rw{margin-left:auto;text-align:right;font:800 20px 'Baloo 2';color:var(--sun);flex:none}
.rw small{display:block;font:600 11px 'Nunito Sans';color:var(--mute)}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px}
.badge.pending{background:rgba(255,210,63,.18);color:var(--sun)}.badge.approved,.badge.paid{background:rgba(61,220,151,.18);color:#3DDC97}.badge.rejected{background:rgba(255,77,109,.2);color:#FF8AA0}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px;background:rgba(255,255,255,.08)}
input::placeholder,textarea::placeholder{color:#8B83B0}
textarea{min-height:84px;resize:vertical}
.hist{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(24,14,60,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;font-weight:700;display:grid;justify-items:center;gap:2px;padding:4px;cursor:pointer}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--sun)}nav button.on svg{stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(255,210,63,.7))}
#sheet{position:fixed;inset:0;background:rgba(8,4,24,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.panel{background:#1C1342;border:1px solid var(--line);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel ol{padding-left:20px;margin:10px 0}.panel li{margin:5px 0}
.code{display:flex;justify-content:space-between;align-items:center;background:rgba(255,210,63,.12);border:1px dashed rgba(255,210,63,.5);border-radius:13px;padding:10px 14px;font-weight:800;margin-top:10px}
.code button{border:0;background:var(--sun);color:#2B1200;border-radius:9px;padding:5px 12px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#fff;color:#1B1240;border-radius:13px;padding:10px 16px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:480px;margin:0 auto}
.big{position:relative;width:160px;height:160px;margin:0 auto 38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 55%,#FF7A00);box-shadow:0 0 70px 18px rgba(255,170,0,.55)}
.big::before{content:"";position:absolute;inset:-36px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,63,.6) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,transparent 55%,#000 56%);mask:radial-gradient(circle,transparent 55%,#000 56%);animation:turn 40s linear infinite}
.login h1{font-size:38px;text-align:center}.login p{text-align:center}
.wheelbox{position:relative;width:250px;height:250px;margin:18px auto 6px}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:6px solid #FFE35C;box-shadow:0 0 30px rgba(255,210,63,.45);background:conic-gradient(#FF4D6D 0 45deg,#FF9A00 45deg 90deg,#FFD23F 90deg 135deg,#3DDC97 135deg 180deg,#FF4D6D 180deg 225deg,#B23AFF 225deg 270deg,#FF9A00 270deg 315deg,#38B6FF 315deg 360deg);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:30px;margin-left:-15px;text-align:center;font:800 22px 'Baloo 2';color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#1C1342;border:4px solid #FFE35C;z-index:2}
.pin{position:absolute;left:50%;top:-12px;margin-left:-14px;width:0;height:0;border:14px solid transparent;border-top:26px solid #fff;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.list{list-style:none;padding:0}.list li{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list li:last-child{border:0}
.list a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;width:100%}
.lvl{margin-top:16px}.lvl p{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:5px}
.bar{height:10px;border-radius:99px;background:rgba(43,18,0,.25);overflow:hidden}.bar i{display:block;height:100%;background:#2B1200;border-radius:99px;transition:width .6s}
.arena{position:relative;height:300px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 0,#4B2A9B,#1C1342);border:1px solid var(--line);touch-action:manipulation;margin-top:12px}
.sb{position:absolute;width:62px;height:62px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FFF6B0,#FFC21A 60%,#FF7A00);box-shadow:0 0 22px rgba(255,200,0,.8);cursor:pointer;animation:pop .18s ease-out}
.sb.bad{background:radial-gradient(circle at 35% 30%,#D5CFF0,#6A5FA8);box-shadow:none}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.gs{display:flex;justify-content:space-between;font:800 18px 'Baloo 2'}
@media(prefers-reduced-motion:reduce){.hero::before,.big::before,.panel{animation:none}.wheel{transition-duration:.01s}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="big"></div>
  <h1>Sunshine Rewards</h1>
  <p class="mute" style="margin:8px 0 24px">Finish simple tasks. Spin daily. Earn real money.</p>
  <button class="btn" id="gbtn" onclick="login()">Continue with Google</button>
  <button class="btn ghost" id="dbtn" onclick="login(true)" hidden>Try demo mode</button>
</div>
<main id="app" class="app" hidden></main>
<nav id="nav" hidden>
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-t="tasks" onclick="go('tasks')"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>Tasks</button>
  <button data-t="wallet" onclick="go('wallet')"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h2"/></svg>Wallet</button>
  <button data-t="refer" onclick="go('refer')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M17 5a3 3 0 0 1 0 6M18 14c2.5.5 4 2.5 4 5"/></svg>Refer</button>
  <button data-t="me" onclick="go('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>Me</button>
</nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== SETTINGS ===== */
const FB={apiKey:"AIzaSyBoomsal7jbIuLTvBBIUM0TgDwfRY0sbdY",authDomain:"sunshine-rewards-eadbf.firebaseapp.com",projectId:"sunshine-rewards-eadbf",storageBucket:"sunshine-rewards-eadbf.firebasestorage.app",messagingSenderId:"198715788076",appId:"1:198715788076:web:c442ef15ab8da4ecdafa89"};
const TELEGRAM="";  // e.g. https://t.me/yourchannel
const TASKS=[
 {id:"5paisa",name:"Open a 5paisa demat account",logo:"5p",reward:260,
  link:"https://5paisa.page.link/M1rxcwtc9TTVE2iy9",code:"55919393",
  steps:["Tap Open link and install 5paisa.","Sign up using the referral code below.","Finish KYC and open your demat account.","Paste your registered mobile number or a screenshot link as proof."],
  note:"Reward is added after review, usually within 1 to 3 days."}
];
const PRIZES=[1,3,2,5,1,4,2,3],WT={1:40,2:25,3:18,4:10,5:7};
/* ==================== */
const DEMO=FB.apiKey.startsWith("YOUR");
const $=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const day=(o=0)=>new Date(Date.now()-o*864e5).toLocaleDateString("en-CA");
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const AV="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" fill="#2A1D63"/><circle cx="24" cy="19" r="8" fill="#FFD23F"/><path d="M8 46c0-9 7-15 16-15s16 6 16 15z" fill="#FF8A00"/></svg>');
let U=null,subs=[],wds=[],tab="home",DB,AUTH,spinning=false;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2500)}
function openSheet(h){$("#panel").innerHTML=h;$("#sheet").classList.add("open")}
function closeSheet(){if(!spinning){stopGame();$("#sheet").classList.remove("open")}}
const LV=[0,50,150,300,600,1000],LN=["Spark","Sunbeam","Sunrise","Daylight","Blaze","Supernova"];
const lvlOf=x=>LV.filter(v=>x>=v).length-1;
function xp(n){const b=lvlOf(U.xp||0);U.xp=(U.xp||0)+n;if(lvlOf(U.xp)>b)setTimeout(()=>{boom();toast("Level up! You are now "+LN[lvlOf(U.xp)])},900)}
function boom(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=["#FFD23F","#FF8A00","#FF4D6D","#B23AFF","#3DDC97","#38B6FF"];
  for(let i=0;i<44;i++){
    const e=document.createElement("i");
    e.style.cssText=`position:fixed;left:50%;top:55%;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;background:${c[i%6]}`;
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,d=120+Math.random()*190;
    e.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+160}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1300,easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish=()=>e.remove();
  }
}

async function save(){DEMO?ls("sr_user",U):await DB.collection("users").doc(U.id).set(U)}
async function loadLists(){
  if(DEMO){const d=ls("sr_lists")||{};subs=d.subs||[];wds=d.wds||[];return}
  const [a,b]=await Promise.all([DB.collection("submissions").where("uid","==",U.id).get(),DB.collection("withdrawals").where("uid","==",U.id).get()]);
  subs=a.docs.map(d=>d.data());wds=b.docs.map(d=>d.data());
}
async function addRec(col,rec){
  (col==="submissions"?subs:wds).push(rec);
  DEMO?ls("sr_lists",{subs,wds}):await DB.collection(col).add(rec);
}
function newUser(id,name,email,photo){
  return {id,name:name||"Friend",email:email||"",photo:photo||"",uc:2,streak:0,last:"",spin:"",xp:0,gd:"",gx:0,code:id.replace(/\W/g,"").slice(0,6).toUpperCase(),by:ls("sr_ref")||"",joined:Date.now()};
}
async function login(){
  try{
    if(DEMO){U=ls("sr_user")||newUser("demo"+Date.now().toString(36),"Demo User","demo@example.com");await save();await loadLists();enter();return}
    await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }catch(e){toast("Sign-in failed. Check Firebase settings and try again.")}
}
function logout(){
  if(DEMO){U=null;$("#app").hidden=$("#nav").hidden=true;$("#login").hidden=false}else AUTH.signOut();
}
function enter(){$("#login").hidden=true;$("#app").hidden=$("#nav").hidden=false;tab="home";render()}

function streakNow(){return(U.last===day()||U.last===day(1))?U.streak:0}
async function checkin(){
  if(U.last===day())return;
  let s=streakNow()+1,msg="Checked in. Come back tomorrow!";
  if(s>=30){U.uc+=10;s=0;msg="Treasure box opened: +10 SC";boom()}
  xp(10);U.streak=s;U.last=day();await save();render();toast(msg+" +10 XP");
}
function openSpin(){
  const labels=PRIZES.map((p,i)=>`<span style="transform:rotate(${i*45+22.5}deg) translateY(-92px) translateX(0)">${p}</span>`).join("");
  openSheet(`<h2 style="text-align:center">Daily spin</h2><p class="mute sm" style="text-align:center">One spin a day. Win 1 to 5 SC.</p>
  <div class="wheelbox"><div class="pin"></div><div class="wheel" id="wheel">${labels}</div><div class="hub"></div></div>
  <button class="btn" id="sbtn" onclick="spin()" ${U.spin===day()?"disabled":""}>${U.spin===day()?"Come back tomorrow":"Spin now"}</button>
  <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
async function spin(){
  if(U.spin===day()||spinning)return;
  spinning=true;$("#sbtn").disabled=true;
  const w=PRIZES.map(p=>WT[p]),tot=w.reduce((a,b)=>a+b);
  let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++}
  const R=360*6-(i*45+22.5);
  $("#wheel").style.transform=`rotate(${R}deg)`;
  const prize=PRIZES[i];U.spin=day();U.uc+=prize;xp(15);
  await new Promise(res=>setTimeout(res,4300));
  spinning=false;await save();boom();toast("You won "+prize+" SC!");
  $("#sbtn").textContent="Come back tomorrow";render();
}
let G=null;
function stopGame(){if(G){clearInterval(G.t);clearInterval(G.s);G=null}}
function openGame(){
  const left=U.gd===day()?Math.max(0,30-U.gx):30;
  openSheet(`<h2 style="text-align:center">Catch the sun</h2>
  <p class="mute sm" style="text-align:center">Tap suns for +1. Grey clouds cost 2. You have 20 seconds. Earn up to 30 XP a day (${left} left today).</p>
  <div class="gs" style="margin-top:12px"><span>Score <b id="gsc">0</b></span><span>Time <b id="gt">20</b></span></div>
  <div class="arena" id="arena"></div>
  <button class="btn" id="gb" onclick="startGame()">Start</button>
  <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
function startGame(){
  stopGame();const ar=$("#arena"),b=$("#gb");b.disabled=true;ar.innerHTML="";
  G={sc:0,tm:20};$("#gsc").textContent=0;$("#gt").textContent=20;
  const sp=()=>{
    const bad=Math.random()<.28,e=document.createElement("button");
    e.className="sb"+(bad?" bad":"");e.setAttribute("aria-label",bad?"cloud":"sun");
    e.style.left=Math.random()*(ar.clientWidth-62)+"px";e.style.top=Math.random()*(ar.clientHeight-62)+"px";
    e.onpointerdown=()=>{if(!G)return;G.sc=Math.max(0,G.sc+(bad?-2:1));$("#gsc").textContent=G.sc;e.remove()};
    ar.appendChild(e);setTimeout(()=>e.remove(),950);
  };
  G.s=setInterval(sp,520);sp();
  G.t=setInterval(async()=>{
    G.tm--;$("#gt").textContent=G.tm;
    if(G.tm<=0){
      const sc=G.sc;stopGame();ar.innerHTML="";
      const used=U.gd===day()?U.gx:0,gain=Math.max(0,Math.min(sc,30-used));
      U.gd=day();U.gx=used+gain;if(gain>0)xp(gain);
      await save();render();b.disabled=false;b.textContent="Play again";
      toast(gain>0?"Score "+sc+". +"+gain+" XP!":"Score "+sc+". Daily XP limit reached.");
    }
  },1000);
}
const subOf=id=>subs.filter(s=>s.task===id).sort((a,b)=>b.t-a.t)[0];
function taskCard(t){
  const s=subOf(t.id);
  return `<button class="task" onclick="openTask('${t.id}')"><div class="logo">${E(t.logo)}</div>
  <div><b>${E(t.name)}</b>${s?`<span class="badge ${s.status}">${s.status}</span>`:`<span class="mute sm">Tap to see steps</span>`}</div>
  <div class="rw">${fmt(t.reward)} SC<small>= ₹${fmt(t.reward)}</small></div></button>`;
}
function openTask(id){
  const t=TASKS.find(x=>x.id===id),s=subOf(id),locked=s&&s.status!=="rejected";
  openSheet(`<div class="row"><h2>${E(t.name)}</h2><span class="rw">${fmt(t.reward)} SC</span></div>
  <ol>${t.steps.map(x=>`<li>${E(x)}</li>`).join("")}</ol>
  <a class="btn" href="${E(t.link)}" target="_blank" rel="noopener">Open link</a>
  ${t.code?`<div class="code"><span>Code: ${E(t.code)}</span><button onclick="copy('${E(t.code)}')">Copy</button></div>`:""}
  <p class="mute sm" style="margin-top:10px">${E(t.note)}</p>
  ${locked?`<p style="margin-top:14px">Your proof status: <span class="badge ${s.status}">${s.status}</span></p>`:
  `<label for="pf">Proof</label><textarea id="pf" placeholder="Registered mobile number or screenshot link"></textarea>
   <button class="btn" onclick="submitProof('${id}')">Submit proof</button>`}
  <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
async function submitProof(id){
  const p=$("#pf").value.trim();
  if(p.length<4)return toast("Add your proof before submitting.");
  await addRec("submissions",{uid:U.id,email:U.email,task:id,proof:p,status:"pending",t:Date.now()});
  xp(50);await save();
  closeSheet();render();toast("Proof submitted. +50 XP");
}
function copy(v){navigator.clipboard?.writeText(v).then(()=>toast("Copied"),()=>toast(v))}
async function withdraw(){
  const upi=$("#upi").value.trim(),amt=Number($("#amt").value);
  if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(upi))return toast("Enter a valid UPI ID, like name@bank.");
  if(!(amt>=5&&amt<=500))return toast("Amount must be between 5 and 500 SC.");
  if(amt>U.uc)return toast("You do not have enough balance.");
  U.uc-=amt;await save();
  await addRec("withdrawals",{uid:U.id,email:U.email,amt,upi,status:"pending",t:Date.now()});
  render();toast("Withdrawal requested.");
}
const refLink=()=>location.origin+location.pathname+"?ref="+U.code;
function share(){open("https://wa.me/?text="+encodeURIComponent("Earn real money with Sunshine Rewards. Join with my link: "+refLink()),"_blank")}
function terms(){openSheet(`<h2>Terms and privacy</h2>
 <p style="margin-top:8px">Rewards are paid only after a task is verified by the partner company. Sunshine Rewards is not responsible for rewards a partner company declines, delays or cancels.</p>
 <p style="margin-top:8px">We store your Google name, email and photo to run your account. We never ask for your password or OTP. Fake or duplicate proofs lead to a ban and loss of balance.</p>
 <button class="btn" onclick="closeSheet()">Got it</button>`);
}

const home=()=>{
  const s=streakNow(),done=U.last===day(),spun=U.spin===day();
  const x=U.xp||0,l=lvlOf(x),pct=l>=5?100:Math.round((x-LV[l])/(LV[l+1]-LV[l])*100);
  const cells=Array.from({length:30},(_,i)=>i===29?`<div class="d gift" title="Treasure box">10</div>`:`<div class="d ${i<s?"on":""}">${i+1}</div>`).join("");
  return `<div class="top"><div><p class="mute">Good day,</p><h1>${E(U.name.split(" ")[0])}</h1></div><img class="av" src="${E(U.photo||AV)}" alt="" referrerpolicy="no-referrer"></div>
  <section class="hero"><p style="font-weight:700">Your balance</p>
  <div class="bal disp"><span class="coin">SC</span>${fmt(U.uc)}</div><p style="font-weight:700">Worth ₹${fmt(U.uc)}</p>
  <button class="btn dark" onclick="go('wallet')" style="width:auto;padding:10px 24px;background:#2B1200">Withdraw</button>
  <div class="lvl"><p><span>Level ${l+1}: ${LN[l]}</span><span>${x} XP${l<5?" / "+LV[l+1]:""}</span></p><div class="bar"><i style="width:${pct}%"></i></div></div></section>
  <div class="tiles">
   <button class="tile hot" onclick="openSpin()"><i>🎡</i><b>Daily spin</b><span>${spun?"Spun today":"Win up to 5 SC"}</span></button>
   <button class="tile" onclick="openGame()"><i>☀️</i><b>Catch the sun</b><span>Play and level up</span></button>
  </div>
  <section class="card"><div class="row"><h3>Daily check-in</h3><span class="chip">${s} of 30</span></div>
  <div class="days">${cells}</div>
  <button class="btn" ${done?"disabled":""} onclick="checkin()">${done?"Checked in today":"Check in"}</button>
  <p class="mute sm" style="margin-top:8px">Check in 30 days in a row to open the treasure box: 10 SC.</p></section>
  <h2 class="sec">Featured task</h2>${taskCard(TASKS[0])}`;
};
const tasks=()=>`<h1 class="top">Tasks</h1>${TASKS.map(taskCard).join("")}<p class="mute sm">New tasks are added regularly.</p>`;
const wallet=()=>{
  const rows=[...wds.map(w=>({t:w.t,a:`Withdrawal to ${E(w.upi)}`,v:"-"+fmt(w.amt)+" SC",s:w.status})),
   ...subs.map(s=>({t:s.t,a:`Task: ${E((TASKS.find(x=>x.id===s.task)||{}).name||s.task)}`,v:"",s:s.status}))].sort((a,b)=>b.t-a.t);
  return `<h1 class="top">Wallet</h1>
  <section class="hero"><p style="font-weight:700">Available</p><div class="bal disp"><span class="coin">SC</span>${fmt(U.uc)}</div><p style="font-weight:700">Worth ₹${fmt(U.uc)}</p></section>
  <section class="card"><h3>Withdraw by UPI</h3>
  <label for="upi">UPI ID</label><input id="upi" placeholder="name@bank" autocomplete="off">
  <label for="amt">Amount in SC</label><input id="amt" type="number" inputmode="decimal" placeholder="Min 5, max 500">
  <button class="btn" onclick="withdraw()">Request withdrawal</button></section>
  <h2 class="sec">History</h2><section class="card">${rows.length?rows.map(r=>`<div class="hist"><div>${r.a}<div class="mute sm">${new Date(r.t).toLocaleDateString()}</div></div><div style="text-align:right">${r.v}<div><span class="badge ${r.s}">${r.s}</span></div></div>`).join(""):`<p class="mute">Nothing yet. Finish a task to get started.</p>`}</section>`;
};
const refer=()=>`<h1 class="top">Refer friends</h1>
  <section class="hero"><h2 style="font-size:26px">Invite friends, earn together</h2><p style="margin-top:6px;font-weight:700">You earn 5% of the task rewards your friends earn.</p></section>
  <section class="card"><p class="mute sm">Your code</p><div class="code"><span>${E(U.code)}</span><button onclick="copy('${E(U.code)}')">Copy</button></div>
  <button class="btn" onclick="share()">Share on WhatsApp</button>
  <button class="btn ghost" onclick="copy(refLink())">Copy invite link</button></section>`;
const me=()=>`<h1 class="top">Me</h1>
  <section class="card row" style="justify-content:flex-start"><img class="av" src="${E(U.photo||AV)}" alt="" referrerpolicy="no-referrer"><div><b>${E(U.name)}</b><div class="mute sm">${E(U.email)}</div></div></section>
  <section class="card"><ul class="list">
   ${TELEGRAM?`<li><a href="${E(TELEGRAM)}" target="_blank" rel="noopener">Join our Telegram <span>↗</span></a></li>`:""}
   <li><a href="#" onclick="terms();return false">Terms and privacy <span>›</span></a></li></ul></section>
  <button class="btn ghost" onclick="logout()">Log out</button>`;
const views={home,tasks,wallet,refer,me};
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
  $("#app").innerHTML=views[tab]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
}

(function boot(){
  const r=new URLSearchParams(location.search).get("ref");if(r)ls("sr_ref",r.toUpperCase().slice(0,12));
  if(DEMO){$("#dbtn").hidden=false;$("#gbtn").hidden=true;if(ls("sr_user"))login();else $("#login").hidden=false;return}
  firebase.initializeApp(FB);AUTH=firebase.auth();DB=firebase.firestore();
  AUTH.onAuthStateChanged(async u=>{
    if(!u){$("#app").hidden=$("#nav").hidden=true;$("#login").hidden=false;return}
    const d=await DB.collection("users").doc(u.uid).get();
    if(d.exists)U=d.data();else{U=newUser(u.uid,u.displayName,u.email,u.photoURL);if(U.by===U.code)U.by="";await save()}
    await loadLists();enter();
  });
})();
</script>
</body>
</html>
